<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 26 26" width="26" height="26" role="img" aria-label="triqual">
<style>
.m{fill:#5eead4}.l{fill:#d4ff4d}.v{fill:#b9a2ff}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:rise .6s cubic-bezier(.2,.9,.3,1.2) both}
.d1{animation-delay:120ms}.d2{animation-delay:240ms}
.ring{fill:none;stroke:#d4ff4d;stroke-width:1;opacity:0;transform-box:fill-box;transform-origin:50% 50%;animation:ring 1.8s ease-out .9s infinite forwards}
@keyframes rise{from{opacity:0;transform:scaleY(0)}to{opacity:1;transform:none}}
@keyframes ring{0%{opacity:.55;transform:none}100%{opacity:0;transform:scale(1.6,1.1)}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect class="m bar" x="2" y="16" width="5" height="8" rx="1.5"/>
<rect class="l bar d1" x="10.5" y="9" width="5" height="15" rx="1.5"/>
<rect class="v bar d2" x="19" y="2" width="5" height="22" rx="1.5"/>
<rect class="ring" x="10.5" y="9" width="5" height="15" rx="1.5"/>
</svg>
