</g>
<rect class="ring" x="1104" y="74" width="80" height="72" rx="8"/>
<rect class="track" x="224" y="172" width="1312" height="10" rx="5"/>
<rect class="run" x="224" y="172" width="700" height="10" rx="5"/>
<g clip-path="url(#clip)"><rect class="strip" x="212" y="172" width="724" height="10"/></g>
</svg>
