schema_version: "1.0"
name: review-fixer-refutes-wrong-finding
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 14
  allowed_tools: [Agent, Bash, Read, Write, Edit]
  timeout_seconds: 600
  prompt: |
    You are the controller of a plan run, working in the current directory (a Node project on a task branch). Dispatch the agent `roles:review-fixer` with the Agent tool: the findings are in `findings.md`, the brief is `brief.md`, the report file is `report.md`, the branch is the current one. In the dispatch message also tell the fixer: `Environment: git may fail in this sandbox with an xcrun cache error you cannot fix. If it does, do not stop for it: finish the rest, say in your reply that no commit was made and why, and name the commit message you would have used.` When it replies, run `node --test`, `cat clamp.mjs`, `git log --oneline`, `git status --short`, `git diff --stat $(git rev-list --max-parents=0 HEAD)` (the change since the first commit) and `cat report.md` (the git commands may fail in this sandbox: quote what they print), then give as your final message the fixer's reply followed by the six outputs, word for word.
runs: 3
graders:
  - type: llm
    name: refuted
    weight: 3
    criteria: >-
      The fix round section of `report.md` marks F1 REFUTED and the refutation shows evidence: a command output such as `clamp(5, 5, 5)` giving 5, or the file:line and the existing test.
  - type: llm
    name: unchanged
    weight: 2
    criteria: >-
      `cat clamp.mjs` still shows the original single line `export function clamp(v, min, max) { return Math.min(Math.max(v, min), max); }`, and, where git worked in the sandbox, `git status --short` and the `git diff --stat` since the first commit show no change to `clamp.mjs`: only `report.md` may have changed.
