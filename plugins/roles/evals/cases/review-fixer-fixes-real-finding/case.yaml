schema_version: "1.0"
name: review-fixer-fixes-real-finding
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 14
  allowed_tools: [Agent, Bash, Read, Write, Edit]
  timeout_seconds: 600
  prompt: |
    You are the controller of a plan run, working in the current directory (a Node project on a task branch). Dispatch the agent `roles:review-fixer` with the Agent tool: the findings are in `findings.md`, the brief is `brief.md`, the report file is `report.md`, the branch is the current one. In the dispatch message also tell the fixer: `Environment: git may fail in this sandbox with an xcrun cache error you cannot fix. If it does, do not stop for it: finish the rest, say in your reply that no commit was made and why, and name the commit message you would have used.` When it replies, run `node --test`, `git log --oneline` and `cat report.md` (`git log` may fail in this sandbox: quote what it prints), then give as your final message the fixer's reply followed by the three outputs, word for word.
runs: 3
graders:
  - type: llm
    name: fixed
    weight: 3
    criteria: >-
      The fix round section of `report.md` marks F1 FIXED, the final `node --test` output passes, and a test of `quantity` (`total([{ price: 2, quantity: 3 }])` is 6) exists (the report or the output names it).
  - type: llm
    name: committed
    weight: 1
    criteria: >-
      `git log --oneline` shows a commit after `init` or, when git failed in the sandbox, the fixer's reply says no commit was made for that reason and names the commit message it would have used.
