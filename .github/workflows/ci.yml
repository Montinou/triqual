# Runs on every pull request of the public repository and repeats the local hooks there: the test suite, the content gate
# (without the private deny list, which CI does not have) and the commit identity check. In any other repository every job is skipped.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  test:
    if: github.repository == 'Montinou/triqual'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  gate:
    if: github.repository == 'Montinou/triqual'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Content gate on the files changed since the merge base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node bin/lib/content-gate.mjs --range "$BASE_SHA...$HEAD_SHA" --no-terms

  identity:
    if: github.repository == 'Montinou/triqual'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Commit identities, strict for the maintainer account
        if: github.event.pull_request.user.login == 'Montinou'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node bin/lib/identity.mjs --range "$BASE_SHA..$HEAD_SHA" --strict
      - name: Commit identities
        if: github.event.pull_request.user.login != 'Montinou'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node bin/lib/identity.mjs --range "$BASE_SHA..$HEAD_SHA"

  ci:
    if: always() && github.repository == 'Montinou/triqual'
    needs: [test, gate, identity]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless test, gate and identity all succeeded
        env:
          TEST_RESULT: ${{ needs.test.result }}
          GATE_RESULT: ${{ needs.gate.result }}
          IDENTITY_RESULT: ${{ needs.identity.result }}
        run: |
          echo "test=$TEST_RESULT gate=$GATE_RESULT identity=$IDENTITY_RESULT"
          if [ "$TEST_RESULT" = success ] && [ "$GATE_RESULT" = success ] && [ "$IDENTITY_RESULT" = success ]; then
            exit 0
          fi
          exit 1
