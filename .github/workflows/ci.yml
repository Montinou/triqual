# Runs the test suite and content gate on every pull request of the public repository.
# The content gate omits the private deny list, which CI does not have. Every job is skipped in other repositories.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  test:
    if: github.repository == 'Montinou/triqual'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  gate:
    if: github.repository == 'Montinou/triqual'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Content gate on the files changed since the merge base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node bin/lib/content-gate.mjs --range "$BASE_SHA...$HEAD_SHA" --no-terms

  ci:
    if: always() && github.repository == 'Montinou/triqual'
    needs: [test, gate]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless test and gate both succeeded
        env:
          TEST_RESULT: ${{ needs.test.result }}
          GATE_RESULT: ${{ needs.gate.result }}
        run: |
          echo "test=$TEST_RESULT gate=$GATE_RESULT"
          if [ "$TEST_RESULT" = success ] && [ "$GATE_RESULT" = success ]; then
            exit 0
          fi
          exit 1
